<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="is-bg-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" rx="12" fill="url(#is-bg-l)"/>
  <circle cx="58" cy="40" r="20" fill="#c4b5fd" opacity="0.5"/>
  <circle cx="432" cy="234" r="30" fill="#a78bfa" opacity="0.35"/>

  <!-- Authoring canvas (left): the keyline an icon is drawn against -->
  <g transform="translate(36,50)">
    <rect x="0" y="0" width="180" height="170" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <path d="M0,12 Q0,0 12,0 L168,0 Q180,0 180,12 L180,26 L0,26 Z" fill="#ede9fe"/>
    <circle cx="16" cy="13" r="3" fill="#c4b5fd"/>
    <circle cx="28" cy="13" r="3" fill="#c4b5fd"/>
    <circle cx="40" cy="13" r="3" fill="#c4b5fd"/>
    <!-- half pixel grid -->
    <g stroke="#ede9fe" stroke-width="1">
      <line x1="30" y1="40" x2="30" y2="156"/>
      <line x1="60" y1="40" x2="60" y2="156"/>
      <line x1="90" y1="40" x2="90" y2="156"/>
      <line x1="120" y1="40" x2="120" y2="156"/>
      <line x1="150" y1="40" x2="150" y2="156"/>
      <line x1="20" y1="60" x2="160" y2="60"/>
      <line x1="20" y1="90" x2="160" y2="90"/>
      <line x1="20" y1="120" x2="160" y2="120"/>
    </g>
    <!-- keyline: rounded square + inscribed circle + violet core -->
    <rect x="58" y="60" width="64" height="64" rx="9" fill="none" stroke="#71717a" stroke-width="3"/>
    <circle cx="90" cy="92" r="27" fill="none" stroke="#71717a" stroke-width="2.4"/>
    <circle cx="90" cy="92" r="9" fill="#7c3aed"/>
    <!-- authoring nib -->
    <g transform="rotate(45 138 46)">
      <rect x="132" y="36" width="12" height="26" rx="2.4" fill="#a78bfa" fill-opacity="0.32" stroke="#6d28d9" stroke-width="2"/>
      <path d="M132,62 L138,72 L144,62 Z" fill="#6d28d9" stroke="#6d28d9" stroke-width="1.6" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Contact sheet (right): the same icon proven on light and dark -->
  <g transform="translate(248,58)">
    <rect x="0" y="0" width="196" height="154" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="8" rx="4" fill="#5b21b6"/>
    <rect x="16" y="30" width="44" height="6" rx="3" fill="#c4b5fd"/>

    <!-- light proof row -->
    <rect x="16" y="50" width="164" height="38" rx="7" fill="#f7f5ff" stroke="#e9e5ff" stroke-width="1.2"/>
    <g fill="none" stroke="#52525b" stroke-width="1.8">
      <rect x="28" y="60" width="18" height="18" rx="3.5"/>
      <circle cx="79" cy="69" r="9"/>
      <path d="M120,60 L129,78 L111,78 Z" stroke-linejoin="round"/>
      <path d="M156,60 l9,0 0,18 -9,0 z"/>
    </g>
    <circle cx="37" cy="69" r="3" fill="#7c3aed"/>
    <circle cx="79" cy="69" r="3" fill="#7c3aed"/>
    <circle cx="120" cy="72" r="3" fill="#7c3aed"/>
    <circle cx="160.5" cy="69" r="3" fill="#7c3aed"/>

    <!-- dark proof row -->
    <rect x="16" y="98" width="164" height="38" rx="7" fill="#1e1730"/>
    <g fill="none" stroke="#c4b5fd" stroke-width="1.8">
      <rect x="28" y="108" width="18" height="18" rx="3.5"/>
      <circle cx="79" cy="117" r="9"/>
      <path d="M120,108 L129,126 L111,126 Z" stroke-linejoin="round"/>
      <path d="M156,108 l9,0 0,18 -9,0 z"/>
    </g>
    <circle cx="37" cy="117" r="3" fill="#a78bfa"/>
    <circle cx="79" cy="117" r="3" fill="#a78bfa"/>
    <circle cx="120" cy="120" r="3" fill="#a78bfa"/>
    <circle cx="160.5" cy="117" r="3" fill="#a78bfa"/>
  </g>

  <!-- proven check badge -->
  <g transform="translate(430,208)">
    <circle r="20" fill="#7c3aed"/>
    <circle r="15.5" fill="#6d28d9"/>
    <path d="M-8 0 L-2 7 L10 -7" stroke="#ffffff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
