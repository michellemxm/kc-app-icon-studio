<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" width="1200" height="288" role="img" aria-label="Icon Studio">
  <defs>
    <linearGradient id="is-dd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171225"/>
      <stop offset="100%" stop-color="#241a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="288" fill="url(#is-dd-bg)"/>

  <!-- Decorative orbs spread across full width so a side crop trims only decoration -->
  <circle cx="90" cy="54" r="28" fill="#4c1d95" opacity="0.45"/>
  <circle cx="56" cy="216" r="14" fill="#6d28d9" opacity="0.4"/>
  <circle cx="620" cy="266" r="16" fill="#4c1d95" opacity="0.4"/>
  <circle cx="1120" cy="58" r="22" fill="#4c1d95" opacity="0.4"/>
  <circle cx="1150" cy="240" r="40" fill="#6d28d9" opacity="0.3"/>

  <!-- Authoring canvas (center-left): the keyline an icon is drawn against -->
  <g transform="translate(140,44)">
    <rect x="0" y="0" width="320" height="200" rx="14" fill="#241b38" stroke="#4c1d95" stroke-width="2.5"/>
    <path d="M0,14 Q0,0 14,0 L306,0 Q320,0 320,14 L320,30 L0,30 Z" fill="#2e2248"/>
    <circle cx="18" cy="15" r="3.5" fill="#6d28d9"/>
    <circle cx="32" cy="15" r="3.5" fill="#6d28d9"/>
    <circle cx="46" cy="15" r="3.5" fill="#6d28d9"/>
    <g stroke="#332552" stroke-width="1.2">
      <line x1="70" y1="46" x2="70" y2="184"/>
      <line x1="120" y1="46" x2="120" y2="184"/>
      <line x1="170" y1="46" x2="170" y2="184"/>
      <line x1="220" y1="46" x2="220" y2="184"/>
      <line x1="270" y1="46" x2="270" y2="184"/>
      <line x1="40" y1="70" x2="292" y2="70"/>
      <line x1="40" y1="115" x2="292" y2="115"/>
      <line x1="40" y1="160" x2="292" y2="160"/>
    </g>
    <!-- keyline: rounded square + inscribed circle + violet core -->
    <rect x="112" y="68" width="96" height="96" rx="13" fill="none" stroke="#8b8ba3" stroke-width="4"/>
    <circle cx="160" cy="116" r="40" fill="none" stroke="#8b8ba3" stroke-width="3.2"/>
    <circle cx="160" cy="116" r="14" fill="#a78bfa"/>
    <!-- authoring nib -->
    <g transform="rotate(45 250 52)">
      <rect x="242" y="38" width="16" height="36" rx="3.2" fill="#a78bfa" fill-opacity="0.28" stroke="#a78bfa" stroke-width="2.6"/>
      <path d="M242,74 L250,88 L258,74 Z" fill="#a78bfa" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Contact sheet (center): the same set proven on light and dark -->
  <g transform="translate(510,52)">
    <rect x="0" y="0" width="380" height="184" rx="12" fill="#241b38" stroke="#4c1d95" stroke-width="2"/>
    <rect x="24" y="20" width="120" height="9" rx="4.5" fill="#ddd6fe"/>
    <rect x="24" y="35" width="72" height="7" rx="3.5" fill="#4c1d95"/>

    <!-- light proof row -->
    <rect x="24" y="52" width="332" height="52" rx="8" fill="#f2effc"/>
    <g fill="none" stroke="#52525b" stroke-width="2">
      <rect x="53" y="69" width="18" height="18" rx="3.5"/>
      <circle cx="126" cy="78" r="9"/>
      <path d="M181,69 L190,87 L172,87 Z" stroke-linejoin="round"/>
      <path d="M245,78 l9,-9 9,9 -9,9 z" stroke-linejoin="round"/>
      <path d="M313,69 l9,0 0,18 -9,0 z"/>
    </g>
    <circle cx="62" cy="78" r="3.2" fill="#7c3aed"/>
    <circle cx="126" cy="78" r="3.2" fill="#7c3aed"/>
    <circle cx="181" cy="81" r="3.2" fill="#7c3aed"/>
    <circle cx="254" cy="78" r="3.2" fill="#7c3aed"/>
    <circle cx="317.5" cy="78" r="3.2" fill="#7c3aed"/>

    <!-- dark proof row -->
    <rect x="24" y="116" width="332" height="52" rx="8" fill="#12101d" stroke="#3b2a5c" stroke-width="1.4"/>
    <g fill="none" stroke="#c4b5fd" stroke-width="2">
      <rect x="53" y="133" width="18" height="18" rx="3.5"/>
      <circle cx="126" cy="142" r="9"/>
      <path d="M181,133 L190,151 L172,151 Z" stroke-linejoin="round"/>
      <path d="M245,142 l9,-9 9,9 -9,9 z" stroke-linejoin="round"/>
      <path d="M313,133 l9,0 0,18 -9,0 z"/>
    </g>
    <circle cx="62" cy="142" r="3.2" fill="#a78bfa"/>
    <circle cx="126" cy="142" r="3.2" fill="#a78bfa"/>
    <circle cx="181" cy="145" r="3.2" fill="#a78bfa"/>
    <circle cx="254" cy="142" r="3.2" fill="#a78bfa"/>
    <circle cx="317.5" cy="142" r="3.2" fill="#a78bfa"/>
  </g>

  <!-- Signature keyline badge (right) -->
  <g transform="translate(1000,144)">
    <circle r="70" fill="#241b38" stroke="#4c1d95" stroke-width="2"/>
    <circle r="70" fill="#a78bfa" opacity="0.08"/>
    <rect x="-34" y="-34" width="68" height="68" rx="10" fill="none" stroke="#a78bfa" stroke-width="3.4"/>
    <circle r="28" fill="none" stroke="#a78bfa" stroke-width="2.8"/>
    <circle r="10" fill="#a78bfa"/>
  </g>

  <!-- proven check badge -->
  <g transform="translate(1058,204)">
    <circle r="22" fill="#7c3aed"/>
    <circle r="17" fill="#a78bfa"/>
    <path d="M-9 0 L-2 8 L11 -8" stroke="#171225" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
